<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagrama de contexto - Sistema de gestión de expedientes clínicos</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-soft: #7a8399;
      --color-rule: rgba(45, 49, 66, 0.12);
      --color-accent: #1e40af;
      --color-accent-tint: rgba(30, 64, 175, 0.08);
      --color-link: #2e5aa8;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
      background: var(--color-paper);
      color: var(--color-ink);
      font-family: var(--font-sans);
    }

    .frame {
      width: 100%;
      max-width: 1280px;
    }

    .eyebrow {
      margin-bottom: 0.5rem;
      color: var(--color-muted);
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin-bottom: 1.5rem;
      color: var(--color-ink);
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      line-height: 1.15;
    }

    svg {
      width: 100%;
      min-width: 900px;
      display: block;
    }
  </style>
</head>
<body>
  <div class="frame">
    <h1>Diagrama de contexto - Sistema de gestión de expedientes clínicos</h1>

    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="contexto-sistema-title contexto-sistema-desc">
      <title id="contexto-sistema-title">Diagrama de contexto - Sistema de gestión de expedientes clínicos</title>
      <desc id="contexto-sistema-desc">Diagrama de contexto que muestra a un usuario interactuando con el sistema portable y el sistema en la nube, con sincronización de datos entre ambos.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#1e40af"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Connectors -->
      <path d="M 560,224 V 292 Q 560,300 552,300 H 292 Q 284,300 284,308 V 404"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="356" y="260" width="140" height="16" rx="2" fill="#f5f5f5"/>
      <text x="428" y="272" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
            text-anchor="middle" letter-spacing="0.06em">REGISTRA HISTORIAS</text>
      <rect x="236" y="340" width="32" height="16" rx="2" fill="#f5f5f5"/>
      <text x="252" y="352" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
            text-anchor="middle" letter-spacing="0.06em">LAN</text>

      <path d="M 720,224 V 292 Q 720,300 728,300 H 996 Q 1004,300 1004,308 V 404"
            fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="788" y="260" width="132" height="16" rx="2" fill="#f5f5f5"/>
      <text x="852" y="272" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
            text-anchor="middle" letter-spacing="0.06em">GESTIONA Y CONSULTA</text>
      <rect x="1012" y="340" width="44" height="16" rx="2" fill="#f5f5f5"/>
      <text x="1036" y="352" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
            text-anchor="middle" letter-spacing="0.06em">HTTPS</text>

      <path d="M 504,452 H 776"
            fill="none" stroke="#1e40af" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="568" y="412" width="144" height="28" rx="2" fill="#f5f5f5"/>
      <text x="640" y="424" fill="#1e40af" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
            text-anchor="middle" letter-spacing="0.06em">SINCRONIZA DATOS</text>
      <text x="640" y="436" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
            text-anchor="middle" letter-spacing="0.06em">INTERNET DISPONIBLE</text>

      <path d="M 776,500 H 504"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="572" y="464" width="136" height="28" rx="2" fill="#f5f5f5"/>
      <text x="640" y="476" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
            text-anchor="middle" letter-spacing="0.06em">ACTUALIZA VIAJES</text>
      <text x="640" y="488" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
            text-anchor="middle" letter-spacing="0.06em">DATOS CONSOLIDADOS</text>

      <!-- Nodes -->
      <rect x="420" y="72" width="440" height="152" rx="8" fill="#f5f5f5"/>
      <rect x="420" y="72" width="440" height="152" rx="8" fill="rgba(79, 93, 117, 0.10)" stroke="#7a8399" stroke-width="1"/>
      <circle cx="640" cy="108" r="28" fill="#ffffff" stroke="#7a8399" stroke-width="1.2"/>
      <circle cx="640" cy="100" r="10" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      <path d="M 616,128 Q 640,108 664,128"
            fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linecap="round"/>
      <text x="640" y="156" fill="#2d3142" font-size="20" font-weight="600"
            font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Usuario</text>
      <text x="640" y="176" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
            text-anchor="middle" letter-spacing="0.08em">[PERSONA]</text>
      <text x="640" y="196" fill="#4f5d75" font-size="12"
            font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Estudiantes y docentes de la universidad</text>

      <rect x="72" y="404" width="432" height="144" rx="8" fill="#f5f5f5"/>
      <rect x="72" y="404" width="432" height="144" rx="8" fill="rgba(30, 64, 175, 0.08)" stroke="#1e40af" stroke-width="1.2"/>
      <text x="288" y="456" fill="#2d3142" font-size="20" font-weight="600"
            font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Sistema portable</text>
      <text x="288" y="476" fill="#1e40af" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
            text-anchor="middle" letter-spacing="0.08em">[SISTEMA DE SOFTWARE]</text>
      <text x="288" y="500" fill="#4f5d75" font-size="12"
            font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Raspberry Pi · operación durante el viaje</text>

      <rect x="776" y="404" width="432" height="144" rx="8" fill="#f5f5f5"/>
      <rect x="776" y="404" width="432" height="144" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="992" y="468" fill="#2d3142" font-size="20" font-weight="600"
            font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Sistema en la nube</text>
      <text x="992" y="488" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
            text-anchor="middle" letter-spacing="0.08em">[SISTEMA DE SOFTWARE]</text>

    </svg>
  </div>
</body>
</html>

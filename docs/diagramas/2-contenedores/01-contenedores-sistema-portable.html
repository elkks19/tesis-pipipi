      background: var(--color-paper);
      color: var(--color-ink);
      font-family: var(--font-sans);

    .frame { width: 100%; max-width: 1600px; }

    h1 {

      color: var(--color-ink);
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      line-height: 1.15;

    svg { width: 100%; min-width: 1160px; display: block; }
